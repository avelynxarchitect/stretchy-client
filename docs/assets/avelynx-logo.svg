<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Gradients -->
    <linearGradient id="metalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    
    <linearGradient id="metalRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Crimson Slash Gradient -->
    <linearGradient id="crimsonEye" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>

    <!-- Bevel Shadows -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Leg of the 'A' -->
  <path d="M 250,45 L 210,45 L 60,370 L 140,370 L 225,185 L 250,130 Z" 
        fill="url(#metalLeft)" />

  <!-- Right Leg of the 'A' (Lower segment below slash) -->
  <path d="M 335,270 L 385,370 L 305,370 L 275,310 Z" 
        fill="url(#metalRight)" />

  <!-- Right Leg of the 'A' (Upper segment above slash) -->
  <path d="M 250,45 L 280,45 L 360,205 L 300,185 L 250,90 Z" 
        fill="url(#metalRight)" />

  <!-- Center Peak Bevel / Ridge -->
  <polygon points="250,45 258,60 250,130 242,60" fill="#ffffff" opacity="0.6" />

  <!-- THE CRIMSON LYNX EYE / SUPERSONIC SLASH -->
  <!-- Outer Aerodynamic Crimson Blade piercing through right leg -->
  <path d="M 125,320 
           C 160,285 200,240 245,215 
           C 285,190 380,145 470,110 
           C 410,155 350,210 300,255 
           C 255,295 205,330 165,340 
           C 145,345 130,335 125,320 Z" 
        fill="url(#crimsonEye)" 
        filter="url(#subtleGlow)" />

  <!-- Upper Eyelid / Blade Edge Highlight -->
  <path d="M 125,320 
           C 170,280 230,230 300,190 
           C 365,155 420,130 470,110 
           C 415,140 350,180 290,215 
           C 220,260 165,300 125,320 Z" 
        fill="#fca5a5" opacity="0.75" />

  <!-- Inner Dark Eye Socket -->
  <path d="M 195,290 
           C 225,255 260,235 295,225 
           C 275,255 240,280 205,295 
           C 200,295 197,293 195,290 Z" 
        fill="#0f172a" />

  <!-- Crimson Lynx Iris & Pupil -->
  <ellipse cx="248" cy="260" rx="18" ry="14" 
           transform="rotate(-22 248 260)" 
           fill="url(#pupilGlow)" />
  
  <ellipse cx="248" cy="260" rx="7" ry="12" 
           transform="rotate(-15 248 260)" 
           fill="#050505" />

  <!-- Eye Light Catch / Glint -->
  <circle cx="244" cy="255" r="3.5" fill="#ffffff" opacity="0.9" />

  <!-- Bottom Slash Accent Wing -->
  <path d="M 148,348 C 175,330 205,305 235,285 C 215,305 185,330 160,345 Z" fill="#991b1b" />
</svg>