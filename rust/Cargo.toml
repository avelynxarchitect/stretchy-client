[package]
name = "stretchy"
version = "1.0.0"
edition = "2021"
authors = ["AveLynx Systems <support@avelynx.net>"]
description = "Official Rust client SDK for the AveLynx Stretchy edge & air-gapped BM25 search engine."
license = "Apache-2.0"
repository = "https://github.com/avelynxarchitect/stretchy-client"
readme = "README.md"
keywords = ["search", "bm25", "lucene", "stretchy", "air-gap"]
categories = ["web-programming::http-client", "database-implementations"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

[[example]]
name = "search_query"
path = "examples/search_query.rs"

[[example]]
name = "airgap_license_check"
path = "examples/airgap_license_check.rs"
